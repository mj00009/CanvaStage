name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    name: Discover .NET solution
    runs-on: windows-latest
    outputs:
      solution: ${{ steps.project.outputs.solution }}
      app_project: ${{ steps.project.outputs.app_project }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Find the solution and WPF application project
        id: project
        shell: pwsh
        run: |
          $solution = Get-ChildItem -Path . -Filter '*.sln' -File -Recurse | Select-Object -First 1
          $appProject = Get-ChildItem -Path . -Filter '*.csproj' -File -Recurse |
            Where-Object { (Get-Content $_.FullName -Raw) -match '<UseWPF>\s*true\s*</UseWPF>' } |
            Select-Object -First 1

          if ($null -eq $solution -or $null -eq $appProject) {
            Write-Host 'No .NET solution and WPF application project are present yet. Build and release jobs are waiting for the implementation.'
            "solution=" >> $env:GITHUB_OUTPUT
            "app_project=" >> $env:GITHUB_OUTPUT
            exit 0
          }

          "solution=$($solution.FullName)" >> $env:GITHUB_OUTPUT
          "app_project=$($appProject.FullName)" >> $env:GITHUB_OUTPUT

  build:
    name: Build, test, and package
    needs: discover
    if: needs.discover.outputs.solution != '' && needs.discover.outputs.app_project != ''
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore "${{ needs.discover.outputs.solution }}"

      - name: Build
        shell: pwsh
        run: dotnet build "${{ needs.discover.outputs.solution }}" --configuration Release --no-restore -bl:build.binlog

      - name: Test
        shell: pwsh
        run: dotnet test "${{ needs.discover.outputs.solution }}" --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Publish self-contained Windows x64 package
        shell: pwsh
        run: >
          dotnet publish "${{ needs.discover.outputs.app_project }}"
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish/CanvaStage-win-x64

      - name: Create portable ZIP and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path publish/CanvaStage-win-x64/* -DestinationPath publish/CanvaStage-win-x64.zip -Force
          (Get-FileHash -Path publish/CanvaStage-win-x64.zip -Algorithm SHA256).Hash | Set-Content -Path publish/CanvaStage-win-x64.zip.sha256 -NoNewline

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore

      - name: Upload Windows release package
        uses: actions/upload-artifact@v4
        with:
          name: CanvaStage-win-x64
          path: |
            publish/CanvaStage-win-x64.zip
            publish/CanvaStage-win-x64.zip.sha256
          if-no-files-found: error

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            **/*.binlog
            **/*.log
            TestResults/
          if-no-files-found: ignore

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            publish/CanvaStage-win-x64.zip
            publish/CanvaStage-win-x64.zip.sha256
