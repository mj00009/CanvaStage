name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    name: Discover .NET solution
    runs-on: windows-latest
    outputs:
      solution: ${{ steps.project.outputs.solution }}
      app_project: ${{ steps.project.outputs.app_project }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Find the solution and WPF application project
        id: project
        shell: pwsh
        run: |
          $solution = Get-ChildItem -Path . -Filter '*.sln' -File -Recurse | Select-Object -First 1
          $appProject = Get-ChildItem -Path . -Filter '*.csproj' -File -Recurse |
            Where-Object { (Get-Content $_.FullName -Raw) -match '<UseWPF>\s*true\s*</UseWPF>' } |
            Select-Object -First 1

          if ($null -eq $solution -or $null -eq $appProject) {
            Write-Host 'No .NET solution and WPF application project are present yet. Build and release jobs are waiting for the implementation.'
            "solution=" >> $env:GITHUB_OUTPUT
            "app_project=" >> $env:GITHUB_OUTPUT
            exit 0
          }

          "solution=$($solution.FullName)" >> $env:GITHUB_OUTPUT
          "app_project=$($appProject.FullName)" >> $env:GITHUB_OUTPUT

  build:
    name: Build, test, and package
    needs: discover
    if: needs.discover.outputs.solution != '' && needs.discover.outputs.app_project != ''
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore "${{ needs.discover.outputs.solution }}"

      - name: Build
        shell: pwsh
        run: dotnet build "${{ needs.discover.outputs.solution }}" --configuration Release --no-restore -bl:build.binlog

      - name: Test
        shell: pwsh
        run: dotnet test "${{ needs.discover.outputs.solution }}" --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Publish self-contained Windows x64 package
        shell: pwsh
        run: >
          dotnet publish "${{ needs.discover.outputs.app_project }}"
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish/CanvaStage-win-x64

      - name: Include license and trademark notices
        shell: pwsh
        run: |
          Copy-Item LICENSE, TRADEMARKS.md -Destination publish/CanvaStage-win-x64 -ErrorAction Stop
          if (-not (Select-String -Path publish/CanvaStage-win-x64/LICENSE -Pattern 'Apache License' -Quiet)) {
            throw 'The portable package is missing the Apache license text.'
          }

      - name: Render UI demo and smoke test published WPF application
        shell: pwsh
        run: |
          $application = Join-Path $PWD 'publish/CanvaStage-win-x64/CanvaStage.Windows.exe'
          $screenshot = Join-Path $PWD 'ci-diagnostics/ui-demo.png'
          $colorPickerScreenshot = Join-Path $PWD 'ci-diagnostics/color-picker.png'
          $mirrorPreviewScreenshot = Join-Path $PWD 'ci-diagnostics/mirror-preview.png'
          $compactViewScreenshot = Join-Path $PWD 'ci-diagnostics/compact-view.png'
          $verificationDirectory = Join-Path $PWD 'ci-diagnostics/verification'
          if (-not (Test-Path $application)) {
            throw "Published application was not found: $application"
          }
          $process = Start-Process -FilePath $application -ArgumentList "--ui-demo-screenshot=$screenshot", "--ui-color-picker-screenshot=$colorPickerScreenshot", "--ui-mirror-preview-screenshot=$mirrorPreviewScreenshot", "--ui-compact-view-screenshot=$compactViewScreenshot", "--ui-verification-directory=$verificationDirectory" -PassThru
          if (-not $process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -Force
            throw 'The published WPF application did not finish Windows verification within two minutes.'
          }
          if ($process.ExitCode -ne 0) {
            throw "The published WPF application UI demo smoke test failed with exit code $($process.ExitCode)."
          }
          if (-not (Test-Path $screenshot)) {
            throw 'The published WPF application did not produce the expected UI demo screenshot.'
          }
          if (-not (Test-Path $colorPickerScreenshot)) {
            throw 'The published WPF application did not produce the expected color-picker screenshot.'
          }
          if (-not (Test-Path $mirrorPreviewScreenshot)) {
            throw 'The published WPF application did not produce the expected Mirror-preview screenshot.'
          }
          if (-not (Test-Path $compactViewScreenshot)) {
            throw 'The published WPF application did not produce the expected compact-view screenshot.'
          }
          $report = Get-Content (Join-Path $verificationDirectory 'verification.json') -Raw | ConvertFrom-Json
          if (-not $report.Passed -or $report.Checks.Count -lt 6) {
            throw 'Windows functional and UI verification did not pass.'
          }

      - name: Collect application diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ci-diagnostics -Force | Out-Null
          $source = Join-Path $env:LOCALAPPDATA 'CanvaStage'
          if (Test-Path $source) {
            Copy-Item -Path (Join-Path $source '*.log') -Destination ci-diagnostics -Force -ErrorAction SilentlyContinue
          }

      - name: Create portable ZIP and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path publish/CanvaStage-win-x64/* -DestinationPath publish/CanvaStage-win-x64.zip -Force
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path publish/CanvaStage-win-x64.zip).Path)
          try {
            foreach ($requiredEntry in @('CanvaStage.Windows.exe', 'LICENSE', 'TRADEMARKS.md')) {
              if (-not $archive.GetEntry($requiredEntry)) {
                throw "The portable ZIP is missing $requiredEntry."
              }
            }
          } finally {
            $archive.Dispose()
          }
          (Get-FileHash -Path publish/CanvaStage-win-x64.zip -Algorithm SHA256).Hash | Set-Content -Path publish/CanvaStage-win-x64.zip.sha256 -NoNewline

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore

      - name: Upload Windows release package
        uses: actions/upload-artifact@v7
        with:
          name: CanvaStage-win-x64
          path: |
            publish/CanvaStage-win-x64.zip
            publish/CanvaStage-win-x64.zip.sha256
          if-no-files-found: error

      - name: Upload UI demo preview
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-demo-preview
          path: |
            ci-diagnostics/**/*.png
            ci-diagnostics/verification/verification.json
            !ci-diagnostics/verification/isolated-storage/**
          # Do not upload the isolated synthetic credential/cache fixtures.
          if-no-files-found: ignore

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-diagnostics
          path: |
            **/*.binlog
            **/*.log
            TestResults/
            ci-diagnostics/
          if-no-files-found: ignore

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag publish/CanvaStage-win-x64.zip publish/CanvaStage-win-x64.zip.sha256 --clobber
          } else {
            $releaseArguments = @(
              'release', 'create', $tag,
              'publish/CanvaStage-win-x64.zip',
              'publish/CanvaStage-win-x64.zip.sha256',
              '--verify-tag', '--generate-notes', '--title', $tag
            )
            if ($tag.Contains('-')) {
              $releaseArguments += '--prerelease'
            }
            & gh @releaseArguments
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release creation or upload failed for $tag."
          }
